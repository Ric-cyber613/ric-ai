<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ric AI — Chat</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <img src="logo.svg" alt="Ric Ai" id="logo" />
    <h1>Ric AI</h1>
  </header>
  <main>
    <div id="chat">
      <div id="left">
        <div id="messages"></div>
        <div id="controls">
          <input id="input" placeholder="Say something..." />
          <button id="send">Send</button>
        </div>
        <div id="settings">
          <label>Mode: <select id="mode"><option>offline</option><option>online</option></select></label>
          <label>Use web research: <input type="checkbox" id="useResearch" /></label>
          <label>Creativity: <input type="range" id="creativity" min="0" max="1" step="0.1" value="0.8" /></label>
        </div>
      </div>

      <aside id="right">
        <section id="auth">
          <h2>Account</h2>
          <div id="userBox">
            <div id="userInfo">Not signed in</div>
            <div id="authForms">
              <input id="loginUser" placeholder="Username" />
              <input id="loginPass" placeholder="Password" type="password" />
              <input id="loginEmail" placeholder="Email (optional for verification)" />
              <button id="loginBtn">Log In</button>
              <button id="registerBtn">Register</button>
              <button id="forgotBtn">Forgot Password</button>
              <button id="logoutBtn" style="display:none">Log Out</button>
            </div>
          </div>
        </section>

        <section id="kb">
          <h2>Knowledge Base</h2>
          <ul id="kbList"></ul>
          <input id="kbQ" placeholder="Question" />
          <input id="kbA" placeholder="Answer" />
          <button id="kbAdd">Add KB</button>
        </section>

        <section id="model">
          <h2>Model</h2>
          <input id="modelName" placeholder="e.g., gpt2" />
          <button id="loadModelBtn">Load Model</button>
          <div id="modelStatus">Model: unknown</div>
        </section>
      </aside>

    </div>
  </main>
  <script src="chat.js"></script>
</body>
</html>
