name: Python tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.9', '3.10', '3.11' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: v1-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            v1-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt || true

      - name: Run unit tests
        env:
          PYTHONUNBUFFERED: 1
        run: |
          pytest -q

      - name: Optionally run gated integration tests
        if: env.RUN_HF_INTEGRATION_TESTS == 'true'
        env:
          RUN_HF_INTEGRATION_TESTS: ${{ env.RUN_HF_INTEGRATION_TESTS }}
        run: |
          echo "Running gated integration tests..."
          pytest tests/test_transformer_integration.py -q || true

      - name: Upload test results (junit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            ./*.xml
            test-results.xml
