name: Python tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.9', '3.10', '3.11' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for committed Python caches
        run: |
          if git ls-files | grep -E "__pycache__|\\.pyc$|\\.pyo$" -q; then
            echo "Error: committed Python cache files found:"
            git ls-files | grep -E "__pycache__|\\.pyc$|\\.pyo$"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: v1-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            v1-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt || true

  lint:
    name: Lint and formatting check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install linting deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run black (check)
        run: |
          black --check . || true

      - name: Run flake8
        run: |
          flake8 || true

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: [ '3.9', '3.10', '3.11' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for committed Python caches
        run: |
          if git ls-files | grep -E "__pycache__|\\.pyc$|\\.pyo$" -q; then
            echo "Error: committed Python cache files found:"
            git ls-files | grep -E "__pycache__|\\.pyc$|\\.pyo$"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: v1-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            v1-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt || true

      - name: Run unit tests (with coverage and junit xml)
        env:
          PYTHONUNBUFFERED: 1
        run: |
          pytest -q --junitxml=pytest-results.xml --cov=src --cov-report=xml --cov-report=term

      - name: Optionally run gated integration tests
        if: env.RUN_HF_INTEGRATION_TESTS == 'true'
        env:
          RUN_HF_INTEGRATION_TESTS: ${{ env.RUN_HF_INTEGRATION_TESTS }}
        run: |
          echo "Running gated integration tests..."
          pytest tests/test_transformer_integration.py -q || true

      - name: Upload test results (junit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            pytest-results.xml
            pytest-results.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
